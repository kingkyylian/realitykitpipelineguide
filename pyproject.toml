[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkp"
version = "0.2.1"
description = "RealityKit Pipeline Toolkit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]
dev = ["ruff>=0.8.0"]

[project.scripts]
rkp = "rkp.cli:main"
rkg = "rkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "Tests", "Tools"]
extend-exclude = [
  "Build",
  "src/rkp.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"Tests/*.py" = ["E402", "I001"]
"Tools/*.py" = ["E402", "I001"]
