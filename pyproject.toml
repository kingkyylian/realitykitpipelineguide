[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkp"
version = "0.1.0"
description = "RealityKit Pipeline Toolkit CLI"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
rkp = "rkp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
