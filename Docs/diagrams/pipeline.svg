<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="360" viewBox="0 0 1320 360" role="img" aria-labelledby="title desc">
  <title id="title">RealityKit Asset Pipeline</title>
  <desc id="desc">Gameplay need moves through asset brief, mesh, UV and texture, USDZ export, Xcode build, RealityKit loader, simulator screenshot, and learning notes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#51606a"/>
    </marker>
    <style>
      .bg { fill: #f7f8f8; }
      .box { fill: #ffffff; stroke: #9aa4aa; stroke-width: 2; rx: 10; }
      .box-asset { fill: #eef6f1; stroke: #4d8b68; }
      .box-code { fill: #eef4fb; stroke: #4d7199; }
      .box-proof { fill: #fff6e6; stroke: #b07a28; }
      .label { fill: #172026; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 650; text-anchor: middle; }
      .sub { fill: #51606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; text-anchor: middle; }
      .arrow { stroke: #51606a; stroke-width: 2.4; marker-end: url(#arrow); fill: none; }
      .section { fill: #51606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1320" height="360"/>
  <text class="section" x="210" y="52">DESIGN</text>
  <text class="section" x="545" y="52">ASSET</text>
  <text class="section" x="875" y="52">APP PIPELINE</text>
  <text class="section" x="1130" y="52">PROOF</text>

  <rect class="box" x="48" y="88" width="150" height="92"/>
  <text class="label" x="123" y="124">Gameplay</text>
  <text class="label" x="123" y="150">ihtiyacı</text>

  <rect class="box" x="242" y="88" width="150" height="92"/>
  <text class="label" x="317" y="124">Asset</text>
  <text class="label" x="317" y="150">brief</text>

  <rect class="box box-asset" x="436" y="88" width="150" height="92"/>
  <text class="label" x="511" y="116">Mesh</text>
  <text class="sub" x="511" y="145">origin / scale</text>

  <rect class="box box-asset" x="630" y="88" width="150" height="92"/>
  <text class="label" x="705" y="116">UV</text>
  <text class="sub" x="705" y="145">material / texture</text>

  <rect class="box box-asset" x="824" y="88" width="150" height="92"/>
  <text class="label" x="899" y="116">USDZ</text>
  <text class="sub" x="899" y="145">export</text>

  <rect class="box box-code" x="1018" y="88" width="150" height="92"/>
  <text class="label" x="1093" y="116">Xcode</text>
  <text class="sub" x="1093" y="145">bundle + build</text>

  <rect class="box box-code" x="48" y="236" width="150" height="92"/>
  <text class="label" x="123" y="264">RealityKit</text>
  <text class="sub" x="123" y="293">loader</text>

  <rect class="box box-proof" x="242" y="236" width="150" height="92"/>
  <text class="label" x="317" y="264">Simulator</text>
  <text class="sub" x="317" y="293">screenshot</text>

  <rect class="box box-proof" x="436" y="236" width="150" height="92"/>
  <text class="label" x="511" y="264">Worklog</text>
  <text class="sub" x="511" y="293">learning note</text>

  <path class="arrow" d="M198 134 H234"/>
  <path class="arrow" d="M392 134 H428"/>
  <path class="arrow" d="M586 134 H622"/>
  <path class="arrow" d="M780 134 H816"/>
  <path class="arrow" d="M974 134 H1010"/>
  <path class="arrow" d="M1093 180 C1093 214 123 202 123 228"/>
  <path class="arrow" d="M198 282 H234"/>
  <path class="arrow" d="M392 282 H428"/>
</svg>
